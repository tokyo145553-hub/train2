<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>運行情報画像ジェネレーター</title>

<style>

body{
  margin:0;
  padding:20px;
  background:#111;
  color:#fff;
  font-family:
    "Hiragino Sans",
    "Yu Gothic UI",
    "Yu Gothic",
    sans-serif;
}

.controls{
  max-width:720px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:12px;
}

h1{
  margin:0 0 10px;
  font-size:28px;
}

label{
  font-size:14px;
}

input,
button{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  border:none;
  border-radius:10px;
  font-size:16px;
}

input{
  background:#222;
  color:#fff;
}

button{
  background:#e11d2e;
  color:#fff;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  opacity:0.9;
}

.checkbox-row{
  display:flex;
  align-items:center;
  gap:8px;
}

.checkbox-row input{
  width:auto;
}

.preview-wrap{
  margin-top:24px;
  display:flex;
  justify-content:center;
}

#canvas{
  width:100%;
  max-width:780px;
  background:#333;
}

.small{
  font-size:13px;
  opacity:0.8;
}

</style>
</head>
<body>

<div class="controls">

<h1>運行情報画像ジェネレーター</h1>

<label>
運転再開見込み
<input type="text" id="resumeText" value="20時30分頃">
</label>

<div class="checkbox-row">
<input type="checkbox" id="showResume" checked>
<label for="showResume">
運転再開見込みを表示する
</label>
</div>

<label>
原因
<input type="text" id="reason" value="信号装置故障">
</label>

<label>
状態
<input type="text" id="status" value="運転見合わせ">
</label>

<button onclick="renderCanvas()">
画像更新
</button>

<button onclick="copyImage()">
画像をコピー
</button>

<div class="small">
スマホ対応 / GitHub Pages対応
</div>

</div>

<div class="preview-wrap">
<canvas id="canvas" width="1400" height="760"></canvas>
</div>

<script>

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function drawTriangle(){

  ctx.strokeStyle = '#ff2a2a';
  ctx.lineWidth = 8;

  ctx.beginPath();

  ctx.moveTo(218,215);
  ctx.lineTo(98,447);
  ctx.lineTo(338,447);

  ctx.closePath();
  ctx.stroke();

  ctx.fillStyle = '#ff2a2a';

  ctx.font =
    'bold 92px "Yu Gothic UI","Yu Gothic",sans-serif';

  ctx.fillText('!',205,388);

}

function wrapText(text,x,y,maxWidth,lineHeight){

  let line='';

  for(let i=0;i<text.length;i++){

    const testLine = line + text[i];
    const width = ctx.measureText(testLine).width;

    if(width > maxWidth && i > 0){

      ctx.fillText(line,x,y);

      line = text[i];
      y += lineHeight;

    }else{

      line = testLine;

    }

  }

  ctx.fillText(line,x,y);

}

function renderCanvas(){

  const resumeText =
    document.getElementById('resumeText').value;

  const reason =
    document.getElementById('reason').value;

  const status =
    document.getElementById('status').value;

  const showResume =
    document.getElementById('showResume').checked;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // 背景
  ctx.fillStyle = '#34343a';
  ctx.fillRect(0,0,1400,760);

  // 赤枠
  ctx.strokeStyle = '#ff1f1f';
  ctx.lineWidth = 18;

  ctx.strokeRect(
    9,
    9,
    canvas.width - 18,
    canvas.height - 18
  );

  // 左灰色線
  ctx.fillStyle = '#8f8f93';

  ctx.fillRect(
    29,
    0,
    11,
    760
  );

  // 警告マーク
  drawTriangle();

  // 再開見込み
  if(showResume){

    ctx.fillStyle = '#f4f4f4';

    ctx.font =
      '500 45px "Yu Gothic UI","Yu Gothic",sans-serif';

    ctx.fillText(
      '運転再開見込み：' + resumeText,
      450,
      77
    );

  }

  // メインタイトル
  ctx.fillStyle = '#f5f5f5';

  ctx.font =
    'bold 108px "Yu Gothic UI","Yu Gothic",sans-serif';

  ctx.fillText(
    status,
    400,
    398
  );

  // 詳細文
  ctx.fillStyle = '#f5f5f5';

  ctx.font =
    '48px "Yu Gothic UI","Yu Gothic",sans-serif';

  const detail =
    reason + 'の影響で運転を見合わせています。';

  wrapText(
    detail,
    182,
    520,
    1040,
    66
  );

}

async function copyImage(){

  canvas.toBlob(async(blob)=>{

    try{

      await navigator.clipboard.write([
        new ClipboardItem({
          'image/png': blob
        })
      ]);

      alert('画像をコピーしました');

    }catch(e){

      console.error(e);

      alert(
        'コピーに失敗しました'
      );

    }

  });

}

renderCanvas();

</script>

</body>
</html>
