<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>運行情報画像ジェネレーター</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  padding:20px;
  background:#111;
  color:#fff;
  font-family:"Noto Sans JP",sans-serif;
}

.controls{
  max-width:760px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:12px;
}

h1{
  margin:0 0 12px;
  font-size:28px;
}

label{
  font-size:14px;
}

input,
button{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-family:"Noto Sans JP",sans-serif;
}

input{
  background:#222;
  color:#fff;
}

button{
  background:#e11d2e;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

button:hover{
  opacity:0.92;
}

.checkbox-row{
  display:flex;
  align-items:center;
  gap:8px;
}

.checkbox-row input{
  width:auto;
}

.preview-wrap{
  margin-top:24px;
  display:flex;
  justify-content:center;
}

#canvas{
  width:100%;
  max-width:1024px;
  background:#37373c;
  display:block;
}

.small{
  font-size:13px;
  opacity:0.8;
}
</style>
</head>
<body>

<div class="controls">
  <h1>運行情報画像ジェネレーター</h1>

  <label>
    運転再開見込み
    <input type="text" id="resumeText" value="20時50分頃">
  </label>

  <div class="checkbox-row">
    <input type="checkbox" id="showResume" checked>
    <label for="showResume">運転再開見込みを表示する</label>
  </div>

  <label>
    原因
    <input type="text" id="reason" value="沿線火災">
  </label>

  <label>
    状態
    <input type="text" id="status" value="運転見合わせ">
  </label>

  <button onclick="renderCanvas()">画像更新</button>
  <button onclick="copyImage()">画像をコピー</button>

  <div class="small">スマホ対応 / GitHub Pages対応</div>
</div>

<div class="preview-wrap">
  <canvas id="canvas" width="1024" height="576"></canvas>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function setFont(weight, size){
  ctx.font = `${weight} ${size}px "Noto Sans JP", sans-serif`;
}

function textWidthTracked(text, tracking = 0){
  let width = 0;
  for(let i = 0; i < text.length; i++){
    width += ctx.measureText(text[i]).width;
    if(i < text.length - 1) width += tracking;
  }
  return width;
}

function drawTrackedText(text, x, y, tracking = 0){
  let cx = x;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    ctx.fillText(ch, cx, y);
    cx += ctx.measureText(ch).width + tracking;
  }
}

function drawTrackedCentered(text, centerX, y, tracking = 0){
  const w = textWidthTracked(text, tracking);
  drawTrackedText(text, centerX - w / 2, y, tracking);
}

function wrapText(text, x, y, maxWidth, lineHeight, tracking = 0){
  let line = '';
  let lines = [];

  for(let i = 0; i < text.length; i++){
    const test = line + text[i];
    const width = textWidthTracked(test, tracking);
    if(width > maxWidth && line){
      lines.push(line);
      line = text[i];
    }else{
      line = test;
    }
  }
  if(line) lines.push(line);

  lines.forEach((lineText, index) => {
    drawTrackedText(lineText, x, y + index * lineHeight, tracking);
  });
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawTriangle(){
  ctx.save();
  ctx.strokeStyle = '#ff2a2a';
  ctx.lineWidth = 5.5;
  ctx.lineJoin = 'miter';

  ctx.beginPath();
  ctx.moveTo(139, 173);
  ctx.lineTo(75, 341);
  ctx.lineTo(267, 341);
  ctx.closePath();
  ctx.stroke();

  // 感嘆符の棒
  ctx.fillStyle = '#ff2a2a';
  roundRect(ctx, 165, 241, 10, 47, 4);
  ctx.fill();

  // 感嘆符の点
  ctx.beginPath();
  ctx.arc(170, 308, 6, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawFrame(){
  const w = canvas.width;
  const h = canvas.height;
  const t = 14;

  ctx.fillStyle = '#ef1f24';

  // 上
  ctx.fillRect(0, 0, w, t);
  // 下
  ctx.fillRect(0, h - t, w, t);
  // 左
  ctx.fillRect(0, 0, t, h);
  // 右
  ctx.fillRect(w - t, 0, t, h);
}

function drawLeftBar(){
  ctx.fillStyle = '#8b8b90';
  ctx.fillRect(16, 14, 22, canvas.height - 28);
}

function fitFontSizeTracked(text, maxWidth, startSize, weight, tracking){
  for(let size = startSize; size >= 10; size--){
    setFont(weight, size);
    if(textWidthTracked(text, tracking) <= maxWidth){
      return size;
    }
  }
  return 10;
}

function renderCanvas(){
  const resumeText = document.getElementById('resumeText').value.trim();
  const reason = document.getElementById('reason').value.trim();
  const status = document.getElementById('status').value.trim();
  const showResume = document.getElementById('showResume').checked;

  // 背景
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#37373c';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 左灰色バー
  drawLeftBar();

  // 赤枠
  drawFrame();

  // 上部見出し
  if(showResume && resumeText){
    ctx.save();
    ctx.fillStyle = '#f3f3f3';
    ctx.textBaseline = 'middle';
    setFont(500, 28);
    drawTrackedCentered(`運転再開見込み：${resumeText}`, 637, 55, 0);
    ctx.restore();
  }

  // 警告マーク
  drawTriangle();

  // 大見出し
  ctx.save();
  ctx.fillStyle = '#f5f5f5';
  ctx.textBaseline = 'middle';

  const titleTracking = -1.5;
  const titleSize = fitFontSizeTracked(status, 560, 76, 700, titleTracking);
  setFont(700, titleSize);
  drawTrackedText(status, 308, 272, titleTracking);

  ctx.restore();

  // 本文
  ctx.save();
  ctx.fillStyle = '#f2f2f2';
  ctx.textBaseline = 'alphabetic';
  setFont(400, 34);

  const detail = `${reason}の影響で運転を見合わせています。`;
  wrapText(detail, 146, 395, 760, 46, 0);

  ctx.restore();
}

async function copyImage(){
  canvas.toBlob(async(blob)=>{
    try{
      await navigator.clipboard.write([
        new ClipboardItem({
          'image/png': blob
        })
      ]);
      alert('画像をコピーしました');
    }catch(e){
      console.error(e);
      alert('コピーに失敗しました');
    }
  });
}

document.fonts.ready.then(renderCanvas);
</script>

</body>
</html>
