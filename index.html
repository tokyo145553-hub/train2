<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>運行情報画像ジェネレーター</title>

<style>

body{
  margin:0;
  padding:20px;
  background:#111;
  color:#fff;
  font-family:
    "Yu Gothic UI",
    "Hiragino Sans",
    sans-serif;
}

.controls{
  max-width:760px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:12px;
}

h1{
  margin:0 0 12px;
  font-size:28px;
}

label{
  font-size:14px;
}

input,
button{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  border:none;
  border-radius:10px;
  font-size:16px;
}

input{
  background:#222;
  color:#fff;
}

button{
  background:#e11d2e;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:0.92;
}

.checkbox-row{
  display:flex;
  align-items:center;
  gap:8px;
}

.checkbox-row input{
  width:auto;
}

.preview-wrap{
  margin-top:24px;
  display:flex;
  justify-content:center;
}

#canvas{
  width:100%;
  max-width:820px;
  background:#34343a;
}

.small{
  font-size:13px;
  opacity:0.8;
}

</style>
</head>
<body>

<div class="controls">

<h1>運行情報画像ジェネレーター</h1>

<label>
運転再開見込み
<input
  type="text"
  id="resumeText"
  value="20時30分頃">
</label>

<div class="checkbox-row">

<input
  type="checkbox"
  id="showResume"
  checked>

<label for="showResume">
運転再開見込みを表示する
</label>

</div>

<label>
原因
<input
  type="text"
  id="reason"
  value="信号装置故障">
</label>

<label>
状態
<input
  type="text"
  id="status"
  value="運転見合わせ">
</label>

<button onclick="renderCanvas()">
画像更新
</button>

<button onclick="copyImage()">
画像をコピー
</button>

<div class="small">
スマホ対応 / GitHub Pages対応
</div>

</div>

<div class="preview-wrap">
<canvas
  id="canvas"
  width="1400"
  height="760">
</canvas>
</div>

<script>

const canvas =
  document.getElementById('canvas');

const ctx =
  canvas.getContext('2d');

function drawTriangle(){

  ctx.strokeStyle = '#ff2b2b';
  ctx.lineWidth = 7.5;

  ctx.beginPath();

  ctx.moveTo(218,214);
  ctx.lineTo(101,445);
  ctx.lineTo(335,445);

  ctx.closePath();

  ctx.stroke();

  ctx.fillStyle = '#ff2b2b';

  ctx.font =
    '700 90px "Yu Gothic UI","Hiragino Sans",sans-serif';

  ctx.fillText(
    '!',
    203,
    387
  );

}

function wrapText(
  text,
  x,
  y,
  maxWidth,
  lineHeight
){

  let line='';

  for(let i=0;i<text.length;i++){

    const testLine =
      line + text[i];

    const width =
      ctx.measureText(testLine).width;

    if(width > maxWidth && i > 0){

      ctx.fillText(
        line,
        x,
        y
      );

      line = text[i];

      y += lineHeight;

    }else{

      line = testLine;

    }

  }

  ctx.fillText(
    line,
    x,
    y
  );

}

function renderCanvas(){

  const resumeText =
    document.getElementById(
      'resumeText'
    ).value;

  const reason =
    document.getElementById(
      'reason'
    ).value;

  const status =
    document.getElementById(
      'status'
    ).value;

  const showResume =
    document.getElementById(
      'showResume'
    ).checked;

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  // 背景
  ctx.fillStyle = '#34343a';

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  // 左灰色ライン
  ctx.fillStyle = '#8d8d92';

  ctx.fillRect(
    30,
    0,
    10,
    760
  );

  // 赤枠
  ctx.strokeStyle = '#ff2020';

  ctx.lineWidth = 16;

  ctx.strokeRect(
    8,
    8,
    canvas.width - 16,
    canvas.height - 16
  );

  // 警告マーク
  drawTriangle();

  // 再開見込み
  if(showResume){

    ctx.fillStyle = '#f4f4f4';

    ctx.font =
      '500 44px "Yu Gothic UI","Hiragino Sans",sans-serif';

    ctx.fillText(
      '運転再開見込み：' + resumeText,
      451,
      77
    );

  }

  // タイトル
  ctx.fillStyle = '#f5f5f5';

  ctx.font =
    '700 104px "Yu Gothic UI","Hiragino Sans",sans-serif';

  ctx.fillText(
    status,
    398,
    395
  );

  // 本文
  ctx.fillStyle = '#f5f5f5';

  ctx.font =
    '48px "Yu Gothic UI","Hiragino Sans",sans-serif';

  const detail =
    reason +
    'の影響で運転を見合わせています。';

  wrapText(
    detail,
    182,
    520,
    1045,
    65
  );

}

async function copyImage(){

  canvas.toBlob(async(blob)=>{

    try{

      await navigator.clipboard.write([
        new ClipboardItem({
          'image/png': blob
        })
      ]);

      alert(
        '画像をコピーしました'
      );

    }catch(e){

      console.error(e);

      alert(
        'コピーに失敗しました'
      );

    }

  });

}

renderCanvas();

</script>

</body>
</html>
