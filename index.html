<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>運行情報画像ジェネレーター</title>

<style>

body{
  margin:0;
  padding:20px;
  background:#111;
  color:#fff;
  font-family:"Hiragino Sans","Yu Gothic",sans-serif;
}

h1{
  margin-top:0;
}

.controls{
  max-width:700px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:12px;
}

label{
  font-size:14px;
}

input,button{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  border:none;
  border-radius:8px;
  font-size:16px;
}

input{
  background:#222;
  color:#fff;
}

button{
  background:#e11d2e;
  color:#fff;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  opacity:0.9;
}

.preview-wrap{
  margin-top:24px;
  display:flex;
  justify-content:center;
}

#canvas{
  width:100%;
  max-width:700px;
  background:#333;
}

.checkbox-row{
  display:flex;
  align-items:center;
  gap:8px;
}

.checkbox-row input{
  width:auto;
}

.small{
  font-size:13px;
  opacity:0.8;
}

</style>
</head>
<body>

<div class="controls">

<h1>運行情報画像ジェネレーター</h1>

<label>
運転再開見込み
<input type="text" id="resumeText" value="20時30分頃">
</label>

<div class="checkbox-row">
<input type="checkbox" id="showResume" checked>
<label for="showResume">運転再開見込みを表示する</label>
</div>

<label>
原因
<input type="text" id="reason" value="信号装置故障">
</label>

<label>
状態
<input type="text" id="status" value="運転見合わせ">
</label>

<button onclick="renderCanvas()">画像更新</button>
<button onclick="copyImage()">画像をコピー</button>

<div class="small">
スマホ対応 / GitHub Pages対応
</div>

</div>

<div class="preview-wrap">
<canvas id="canvas" width="1400" height="760"></canvas>
</div>

<script>

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function drawTriangle(){

  ctx.strokeStyle = '#ff2a2a';
  ctx.lineWidth = 10;

  ctx.beginPath();
  ctx.moveTo(220,220);
  ctx.lineTo(100,450);
  ctx.lineTo(340,450);
  ctx.closePath();
  ctx.stroke();

  ctx.fillStyle = '#ff2a2a';
  ctx.font = 'bold 90px sans-serif';
  ctx.fillText('!',205,390);

}

function renderCanvas(){

  const resumeText = document.getElementById('resumeText').value;
  const reason = document.getElementById('reason').value;
  const status = document.getElementById('status').value;
  const showResume = document.getElementById('showResume').checked;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // 背景
  ctx.fillStyle = '#333338';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // 赤枠（コピー画像にも含まれる）
  ctx.strokeStyle = '#ff1f1f';
  ctx.lineWidth = 18;
  ctx.strokeRect(9,9,canvas.width-18,canvas.height-18);

  // 左側ライン
  ctx.fillStyle = '#888';
  ctx.fillRect(30,0,10,760);

  // 警告マーク
  drawTriangle();

  // 再開見込み
  if(showResume){

    ctx.fillStyle = '#fff';
    ctx.font = '48px sans-serif';

    ctx.fillText(
      '運転再開見込み：' + resumeText,
      450,
      80
    );

  }

  // メインタイトル
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 110px sans-serif';

  ctx.fillText(status,400,400);

  // 詳細
  ctx.font = '56px sans-serif';

  const detail =
    reason + 'の影響で運転を見合わせています。';

  wrapText(detail,180,520,1000,72);

}

function wrapText(text,x,y,maxWidth,lineHeight){

  let line = '';

  for(let i=0;i<text.length;i++){

    const testLine = line + text[i];
    const metrics = ctx.measureText(testLine);
    const testWidth = metrics.width;

    if(testWidth > maxWidth && i > 0){

      ctx.fillText(line,x,y);

      line = text[i];
      y += lineHeight;

    }else{

      line = testLine;

    }

  }

  ctx.fillText(line,x,y);

}

async function copyImage(){

  canvas.toBlob(async(blob)=>{

    try{

      await navigator.clipboard.write([
        new ClipboardItem({
          'image/png': blob
        })
      ]);

      alert('画像をコピーしました');

    }catch(e){

      console.error(e);
      alert('コピーに失敗しました');

    }

  });

}

renderCanvas();

</script>

</body>
</html>
